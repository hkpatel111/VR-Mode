name: Build VR Mode APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect and extract source zip (if present in root)
        run: |
          set -e
          echo "Looking for source zip in repository root..." | tee -a build_log.txt
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1 || true)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip: $ZIP_FILE" | tee -a build_log.txt
            mkdir -p /tmp/vrmode_extract
            unzip -q "$ZIP_FILE" -d /tmp/vrmode_extract
            PROJECT_DIR=$(find /tmp/vrmode_extract -type f -name "settings.gradle" | head -n 1 | xargs dirname || true)
            if [ -z "$PROJECT_DIR" ]; then
              PROJECT_DIR=$(find /tmp/vrmode_extract -type d -name "app" | head -n 1 | xargs dirname || true)
            fi
            if [ -n "$PROJECT_DIR" ]; then
              echo "Project root detected at: $PROJECT_DIR" | tee -a build_log.txt
              cp -a "$PROJECT_DIR"/. .
              echo "Source extracted successfully" | tee -a build_log.txt
              ls -la | tee -a build_log.txt
            else
              echo "ERROR: Could not locate Android project inside zip" | tee -a build_log.txt
              exit 1
            fi
          else
            echo "No zip found in root – assuming source is already present" | tee -a build_log.txt
            ls -la | tee -a build_log.txt
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # Fixed: do NOT install deprecated 'tools' package
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Accept licenses + create local.properties
        run: |
          set -e
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          echo -e "24333f8a63b6825ea9c5514f07c3611f\n" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "Licenses accepted + local.properties written" | tee -a build_log.txt
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" | tee -a build_log.txt
          cat local.properties | tee -a build_log.txt

      # Use official gradle action – handles wrapper download automatically
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          set -o pipefail
          echo "===== Starting Gradle Build =====" | tee -a build_log.txt
          # Prefer existing wrapper; otherwise generate one
          if [ ! -f "./gradlew" ]; then
            echo "gradlew missing – creating wrapper with Gradle 8.2" | tee -a build_log.txt
            gradle wrapper --gradle-version 8.2 2>&1 | tee -a build_log.txt || true
          fi
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee -a build_log.txt
          else
            echo "ERROR: Could not create or find gradlew" | tee -a build_log.txt
            exit 1
          fi
          echo "===== Gradle Build Finished =====" | tee -a build_log.txt

      - name: Check APK output
        if: always()
        run: |
          echo "===== Looking for APK =====" | tee -a build_log.txt
          find . -path "*/outputs/apk/debug/*.apk" 2>/dev/null | tee -a build_log.txt || echo "No APK found" | tee -a build_log.txt
          ls -la app/build/outputs/apk/debug/ 2>/dev/null | tee -a build_log.txt || true

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VRMode-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          if-no-files-found: ignore
