name: Build VR Mode APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect and extract source zip (if present in root)
        run: |
          echo "Looking for source zip in repository root..."
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip: $ZIP_FILE"
            # Extract into a temporary folder then move contents to workspace root
            mkdir -p /tmp/vrmode_extract
            unzip -q "$ZIP_FILE" -d /tmp/vrmode_extract
            # Find the actual project root (folder that contains settings.gradle or app/)
            PROJECT_DIR=$(find /tmp/vrmode_extract -type f -name "settings.gradle" | head -n 1 | xargs dirname)
            if [ -z "$PROJECT_DIR" ]; then
              PROJECT_DIR=$(find /tmp/vrmode_extract -type d -name "app" | head -n 1 | xargs dirname)
            fi
            if [ -n "$PROJECT_DIR" ]; then
              echo "Project root detected at: $PROJECT_DIR"
              # Copy everything to current workspace
              cp -a "$PROJECT_DIR"/. .
              echo "Source extracted successfully"
              ls -la
            else
              echo "Could not locate Android project inside zip"
              exit 1
            fi
          else
            echo "No zip found in root – assuming source is already present"
            ls -la
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew (if present)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "gradlew not found – will use system gradle"
          fi

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            # Fallback if wrapper is missing
            gradle wrapper --gradle-version 8.2
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VRMode-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: List output
        run: |
          echo "=== Build outputs ==="
          find app/build/outputs -name "*.apk" 2>/dev/null || echo "No APK found"
          
